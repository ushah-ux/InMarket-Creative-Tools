    <g fill="#4591c7"><rect x="328" y="196" width="14" height="22" fill="#aed7f4"/><rect x="346" y="200" width="14" height="18"/><rect x="364" y="194" width="14" height="24" fill="#7dbe42"/><rect x="382" y="198" width="12" height="20" fill="#aed7f4"/></g>
