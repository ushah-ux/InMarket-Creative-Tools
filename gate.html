<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>InMarket Creative Tools</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{--night:#121e33;--metric:#243e66;--magnet:#4591c7;--display:#c7e6fc;--conv:#d5e3ed;--green:#7dbe42;--green-deep:#69a636;--n200:#f5f6f8;--n400:#c9d0d4;--muted:#4b5d78;--error:#c0392b;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--n200);color:var(--night);font-family:Montserrat,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:16px;overflow:hidden}
body::before{content:"";position:fixed;right:-200px;top:-220px;width:620px;height:620px;border-radius:50%;background:radial-gradient(closest-side,var(--display),transparent);pointer-events:none}
.card{position:relative;width:100%;max-width:400px;background:#fff;border:1px solid var(--conv);border-radius:18px;padding:36px 32px 30px;box-shadow:0 20px 50px -24px rgba(18,30,51,.25)}
.card img{display:block;height:22px;width:auto;margin-bottom:28px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green-deep);margin:0 0 8px}
h1{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:0 0 6px}
p.sub{color:var(--muted);font-size:14px;margin:0 0 24px;line-height:1.5}
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
input[type=password]{width:100%;font:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--n400);border-radius:10px;color:var(--night);background:#fff}
input[type=password]:focus{outline:none;border-color:var(--magnet);box-shadow:0 0 0 3px rgba(69,145,199,.18)}
.err input[type=password]{border-color:var(--error)}
.msg{min-height:20px;font-size:13px;color:var(--error);margin:8px 0 6px}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin:0 0 18px;cursor:pointer}
.remember input{accent-color:var(--green);width:16px;height:16px}
button{width:100%;font:inherit;font-weight:700;font-size:14px;border:0;border-radius:999px;background:var(--night);color:#fff;padding:13px 18px;cursor:pointer;transition:background .15s}
button:hover{background:var(--metric)}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.foot{margin-top:22px;font-size:12px;color:var(--muted);text-align:center}
.loading .card{visibility:hidden}
</style>
</head>
<body>
<form class="card" id="gate" autocomplete="on">
  <img src="inmarket-logo.png" srcset="inmarket-logo.png 1x, inmarket-logo@2x.png 2x" alt="InMarket" width="125" height="22">
  <p class="eyebrow">Creative Tools</p>
  <h1>Team access</h1>
  <p class="sub">Enter the team password to open InMarket's creative tools.</p>
  <input type="text" name="username" value="InMarket Creative Tools" autocomplete="username" hidden>
  <label for="pw">Password</label>
  <input type="password" id="pw" autocomplete="current-password" required autofocus>
  <div class="msg" id="msg" role="alert"></div>
  <label class="remember"><input type="checkbox" id="remember" checked> Remember me on this device</label>
  <button type="submit" id="go">Unlock</button>
  <div class="foot">Need access? Ask the InMarket creative team.</div>
</form>
<script>
(() => {
const P = __PAYLOAD__;
const STORE = "imct-key";
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));

async function unlock(key) {
  // Swapping documents while this one is still parsing would merge the two pages.
  if (document.readyState === "loading") await new Promise(r => document.addEventListener("DOMContentLoaded", r, { once: true }));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.data));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
function store(get, val) {
  try { return get ? localStorage.getItem(STORE) : (val ? localStorage.setItem(STORE, val) : localStorage.removeItem(STORE)); } catch { return null; }
}

(async () => {
  const saved = store(true);
  if (!saved) return;
  document.body.classList.add("loading");
  try {
    const { salt, k } = JSON.parse(saved);
    if (salt !== P.salt) throw 0;   // password was changed since last visit
    await unlock(await crypto.subtle.importKey("raw", bytes(k), "AES-GCM", false, ["decrypt"]));
  } catch { store(false, null); document.body.classList.remove("loading"); }
})();

document.getElementById("gate").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw"), msg = document.getElementById("msg"), go = document.getElementById("go");
  go.disabled = true; go.textContent = "Unlocking…"; msg.textContent = "";
  try {
    const key = await keyFrom(pw.value);
    if (document.getElementById("remember").checked) {
      store(false, JSON.stringify({ salt: P.salt, k: b64(await crypto.subtle.exportKey("raw", key)) }));
    }
    await unlock(key);
  } catch {
    store(false, null);
    e.target.classList.add("err");
    msg.textContent = "That password isn't right. Try again.";
    go.disabled = false; go.textContent = "Unlock";
    pw.select();
  }
});
})();
</script>
</body>
</html>
